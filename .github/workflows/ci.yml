name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Semanal: detecta roturas por dependencias nuevas aunque no haya commits.
    - cron: "23 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e .
      - name: Detecta un bind-mount que no existe de verdad
        run: |
          mkdir -p /tmp/smoke
          cat > /tmp/smoke/docker-compose.yml <<'EOF'
          services:
            web:
              image: nginx
              volumes:
                - ./no-existe-de-verdad:/data
          EOF
          if composeready /tmp/smoke; then
            echo "debería haber fallado (exit != 0)" >&2
            exit 1
          fi
      - name: Un compose limpio no da falsos positivos
        run: |
          mkdir -p /tmp/smoke-clean
          cat > /tmp/smoke-clean/docker-compose.yml <<'EOF'
          services:
            web:
              image: nginx
          EOF
          composeready /tmp/smoke-clean
