[project]
name = "composeready"
version = "0.1.0"
description = "Comprueba, antes de 'docker compose up', si el host real cumple lo que el compose asume: rutas de bind-mount, puertos libres y GPU/NVIDIA runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.17.3",
]

[project.scripts]
composeready = "composeready.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["composeready*"]

[tool.ruff]
line-length = 100
target-version = "py311"
